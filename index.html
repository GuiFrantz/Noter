<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="images/logo.png" type="image/x-icon" />
  <title>Noter</title>
  <style>
    @media (pointer: coarse) {
      footer {
        display: none;
      }
    }

    /* The editor is the only thing that scrolls, never the page */
    html,
    body {
      overflow: hidden;
    }

    body {
      height: 100vh;
      height: 100dvh;
    }

    @media (max-width: 400px) {
      header h1 {
        display: none;
      }
    }

    @media (max-width: 300px) {
      * {
        font-size: 0.8rem;
      }
    }

    /* ---------- Edge fade: text dissolves behind the header/footer ---------- */

    /* Text is fully hidden behind the bars (solid), then fades in over the next stretch (end) */
    .editor-container {
      --top-solid: 2.5rem;
      --top-end: 3.75rem;
      --bottom-solid: 2.5rem;
      --bottom-end: 3.75rem;
      --bar-alpha: 0.07; /* how much text still shows through behind the bars */
    }

    @media (pointer: coarse) {
      .editor-container {
        --bottom-solid: 0rem;
        --bottom-end: 1.25rem;
      }
    }

    #editor {
      padding-top: var(--top-end);
      padding-bottom: var(--bottom-end);
      -webkit-mask-image: linear-gradient(to bottom,
          rgba(0, 0, 0, var(--bar-alpha)) var(--top-solid),
          #000 var(--top-end),
          #000 calc(100% - var(--bottom-end)),
          rgba(0, 0, 0, var(--bar-alpha)) calc(100% - var(--bottom-solid)));
      mask-image: linear-gradient(to bottom,
          rgba(0, 0, 0, var(--bar-alpha)) var(--top-solid),
          #000 var(--top-end),
          #000 calc(100% - var(--bottom-end)),
          rgba(0, 0, 0, var(--bar-alpha)) calc(100% - var(--bottom-solid)));
    }

    /* "saved" fades out to the left over the filename instead of cutting it */
    #lastSaved {
      padding-left: 1.5rem;
      background: linear-gradient(to right, transparent, rgba(37, 46, 59, 0.95) 1.25rem);
    }

    #editor::-webkit-scrollbar {
      width: 0;
      height: 0;
    }

    #editor {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .custom-scrollbar-thumb {
      position: absolute;
      right: 1px;
      width: 1px;
      background-color: #7e827a;
      border-radius: 1px;
      opacity: 0;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }

    .custom-scrollbar-thumb.visible {
      opacity: 1;
    }

    /* ---------- Footer: stats + actions ---------- */

    /* Stats (bottom left) fade out while the actions are open */
    #footer .stats {
      transition: opacity 0.3s ease-in-out;
    }

    #footer[data-open="true"] .stats {
      opacity: 0;
      pointer-events: none;
    }

    /* Ellipsis stays lit while the actions are open */
    #menuBtn[aria-expanded="true"] {
      color: #e3cda4;
    }

    /* Actions slide in to the left of the ellipsis; scroll horizontally if they don't fit */
    #actions {
      background: linear-gradient(to right, transparent, rgba(37, 46, 59, 0.95) 1.25rem);
      height: 2rem;
      min-width: 0;
      max-width: 0;
      opacity: 0;
      transform: translateX(0.5rem);
      pointer-events: none;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
      transition: max-width 0.3s ease-in-out, opacity 0.3s ease-in-out,
        transform 0.3s ease-in-out;
    }

    #actions::-webkit-scrollbar {
      width: 0;
      height: 0;
    }

    #footer[data-open="true"] #actions {
      max-width: 40rem;
      opacity: 1;
      transform: translateX(0);
      pointer-events: auto;
    }

    @media (prefers-reduced-motion: reduce) {

      #footer .stats,
      #actions {
        transition: none;
      }
    }
  </style>
</head>

<body class="relative bg-[#252e3b] text-[#e3cda4] max-w-[792px] mx-auto px-3">
  <header class="absolute top-0 left-3 right-3 z-10 flex flex-row items-center h-12">
    <div class="flex flex-row items-center flex-1 min-w-0">
      <img src="images/logo.png" alt="Noter" id="logo-header" class="max-w-[1.5rem] shrink-0" />
      <h1 class="text-[1rem] mr-3">Noter</h1>
      <input type="text" id="filename" value="Untitled" placeholder="Filename" maxlength="50"
        class="flex-1 min-w-0 bg-transparent border-0 text-[1rem] text-[#7e827a] focus:outline-none" />
    </div>
    <p id="lastSaved" class="absolute right-0 pointer-events-none empty:hidden"></p>
  </header>
  <div class="editor-container absolute inset-y-0 left-3 right-3">
    <textarea id="editor" placeholder="Start typing..."
      class="w-full h-full text-[1rem] leading-6 resize-none bg-transparent text-[#e3cda4] outline-none border-0 placeholder:text-[#7e827a]"></textarea>
    <div id="scrollThumb" class="custom-scrollbar-thumb"></div>
  </div>
  <footer id="footer" data-open="false"
    class="absolute bottom-0 left-5 right-5 mb-2 z-10 p-0 bg-transparent flex justify-end items-center text-[0.8rem] min-h-[2rem]">
    <div class="stats absolute left-0 bottom-0 flex items-center h-8 whitespace-nowrap">
      <button id="charCountBtn"
        class="bg-transparent border-0 h-full pl-0 pr-3 cursor-pointer text-[#7e827a] transition ease-in-out duration-100 hover:text-[#e3cda4]">
        0 chars
      </button>
      <span class="text-[#7e827a] opacity-40 select-none">|</span>
      <span id="ttrBtn" class="flex items-center h-full px-3 text-[#7e827a]">
        0'00"
      </span>
    </div>
    <nav id="actions" inert class="relative z-10 flex items-center whitespace-nowrap">
      <div id="actionsInner" class="flex flex-none items-center h-8">
        <button id="openFileBtn"
          class="bg-transparent border-0 h-full px-3 cursor-pointer text-[#7e827a] transition ease-in-out duration-100 hover:text-[#e3cda4]">
          Load
        </button>
        <span class="text-[#7e827a] opacity-40 select-none">|</span>
        <button id="downloadFileBtn"
          class="bg-transparent border-0 h-full px-3 cursor-pointer text-[#7e827a] transition ease-in-out duration-100 hover:text-[#e3cda4]">
          Download
        </button>
        <span class="text-[#7e827a] opacity-40 select-none">|</span>
        <button id="newFileBtn"
          class="bg-transparent border-0 h-full px-3 cursor-pointer text-[#7e827a] transition ease-in-out duration-100 hover:text-[#e3cda4]">
          New
        </button>
        <span class="text-[#7e827a] opacity-40 select-none">|</span>
        <a href="https://github.com/GuiFrantz/noter" target="_blank" rel="noopener noreferrer"
          class="no-underline cursor-pointer h-full px-3 flex items-center text-[#7e827a] transition ease-in-out duration-100 hover:text-[#e3cda4]">
          Gui Frantz
        </a>
      </div>
    </nav>
    <button id="menuBtn" type="button" aria-label="Actions" aria-expanded="false" aria-controls="actions"
      class="bg-transparent border-0 h-8 pl-3 pr-0 cursor-pointer text-[#7e827a] tracking-widest select-none transition ease-in-out duration-100 hover:text-[#e3cda4] focus-visible:text-[#e3cda4] focus:outline-none">•••</button>
  </footer>

  <script src="script.js"></script>
</body>

</html>
